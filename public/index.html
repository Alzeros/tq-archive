<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TQ Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <strong>TQ Hub</strong>
          <span id="syncState">未同步节点</span>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" title="切换配色" aria-label="切换配色">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden>
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
          </svg>
        </button>
      </div>
      <button id="syncButton" class="primary wide" type="button">从探针同步节点</button>
      <input id="nodeFilter" class="search" type="search" placeholder="筛选节点…" autocomplete="off">
      <div id="nodeList" class="node-list"></div>
      <div class="sidebar-foot">
        <button id="logoutButton" class="ghost wide" type="button">退出登录</button>
      </div>
    </aside>

    <main class="content">
      <nav class="tabs">
        <button class="tab active" data-view="dashboard" type="button">看板</button>
        <button class="tab active" data-view="import" type="button">导入报告</button>
        <button class="tab" data-view="history" type="button">历史报告</button>
        <button class="tab" data-view="compare" type="button">变化对比</button>
      </nav>

      <section id="view-dashboard" class="view active">
        <div class="card">
          <h2>概览</h2>
          <div id="dashStats" class="dash-stats"></div>
        </div>
        <div class="card hidden" id="dashAlertCard">
          <h2>需要关注的节点</h2>
          <p class="hint">最近一份报告里出现了"差"档指标，点行直接打开详情。</p>
          <div id="dashAlerts" class="list"></div>
        </div>
        <div class="card">
          <h2>节点健康</h2>
          <p class="hint">按最近一次测试时间排序。延迟/丢包/回程速度与详情页徽标同源。</p>
          <div id="dashHealth" class="dash-health"></div>
        </div>
        <div class="card">
          <h2>最近导入</h2>
          <div id="recentImports" class="list"></div>
        </div>
      </section>

      <section id="view-import" class="view">
        <div class="card">
          <h2>粘贴 TQ 报告链接</h2>
          <p class="hint">先解析并预览，确认无误后再绑定到节点。重复报告会被拒绝。</p>
          <form id="previewForm" class="row-form">
            <input id="reportUrl" type="url" placeholder="https://tcpquality.ibsgss.uk/r/xxxxxxxx" required>
            <button class="primary" type="submit">解析</button>
          </form>
          <div id="previewResult" class="preview hidden"></div>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="card">
          <h2 id="historyTitle">请选择节点</h2>
          <div id="trendPanel" class="trend hidden"></div>
          <div id="historyList" class="list"></div>
        </div>
        <div class="card hidden" id="detailCard">
          <div class="detail-head">
            <h2 id="detailTitle">报告详情</h2>
            <div class="actions">
              <a id="openOriginal" class="button ghost" target="_blank" rel="noreferrer noopener">原始报告</a>
              <a id="downloadJson" class="button ghost" download>JSON</a>
              <a id="downloadRaw" class="button ghost" download>原始 HTML</a>
            </div>
          </div>
          <div id="detailWarnings"></div>
          <div class="detail-bind">
            <span class="meta">归属节点：<strong id="bindCurrent">—</strong></span>
            <button id="bindToggle" class="ghost" type="button">改绑节点</button>
          </div>
          <div id="bindPanel" class="bind-panel hidden">
            <div id="bindPicker" class="picker"></div>
            <button id="bindConfirm" class="primary" type="button">确认改绑</button>
          </div>
          <div id="detailSummary"></div>
          <details id="detailRaw" class="raw-wrap">
            <summary>查看原始数据 · 按维度分表，共 <span id="rawCount">0</span> 条记录</summary>
            <div id="detailBody" class="table-wrap"></div>
          </details>
        </div>
      </section>

      <section id="view-compare" class="view">
        <div class="card">
          <h2>选择同一节点的两份报告</h2>
          <div class="row-form">
            <select id="compareNode"></select>
            <select id="compareBase"></select>
            <select id="compareCurrent"></select>
            <button id="runCompare" class="primary" type="button">对比</button>
          </div>
          <p class="hint">变化按“当前报告 − 基础报告”计算。延迟、丢包、速度含义不同，请结合数值判断好坏。</p>
        </div>
        <div class="card hidden" id="compareResult">
          <h2 id="compareTitle">变化明细</h2>
          <div class="filters">
            <select id="changeFilter"></select>
            <select id="changeDirection">
              <option value="all">全部变化</option>
              <option value="up">上升</option>
              <option value="down">下降</option>
              <option value="same">无变化</option>
            </select>
            <label class="inline"><input type="checkbox" id="onlyChanged" checked> 仅显示有变化的项</label>
          </div>
          <div id="changeBody" class="table-wrap"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
