<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>节点管理 · TQ Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="sub-body">
  <div id="toast" class="toast"></div>
  <div class="sub-page">
    <header class="sub-header">
      <div>
        <h1 class="sub-title">节点管理</h1>
        <p class="sub-desc">节点从探针同步。只有<strong>启用</strong>的节点会出现在侧边栏、看板和变化对比里；停用只是隐藏，已有报告不会删除，重新启用即可恢复。从探针下线的节点会标记为「探针已移除」并保留历史数据（绝不自动删除），如需彻底清理可手动删除。</p>
      </div>
      <a href="/" class="button ghost sub-back">← 返回首页</a>
    </header>

    <section class="sub-card">
      <div class="nodes-head">
        <div>
          <h2 class="sub-card-title">节点列表</h2>
          <p id="nodesSummary" class="nodes-summary">加载中…</p>
        </div>
        <button id="syncButton" class="button ghost small" type="button" title="从探针拉取最新的节点列表；新出现的节点默认停用">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
          <span>从探针同步</span>
        </button>
      </div>
      <div class="nodes-toolbar">
        <input id="nodeSearch" class="sub-input" type="search" placeholder="搜索节点名称…" autocomplete="off">
        <div class="nodes-bulk">
          <button class="sub-btn" type="button" data-bulk="tested" title="有报告的启用，没有报告的停用">只启用有报告的</button>
          <button class="sub-btn" type="button" data-bulk="on">全部启用</button>
          <button class="sub-btn" type="button" data-bulk="off">全部停用</button>
        </div>
      </div>
      <p id="bulkScope" class="nodes-scope" hidden></p>
      <div id="nodeGroups" class="nodes-groups"></div>
    </section>
  </div>

  <dialog id="deleteNodeDialog" class="confirm-dialog" aria-labelledby="delDialogTitle">
    <form method="dialog" id="delDialogForm" class="confirm-dialog-box">
      <h3 id="delDialogTitle" class="confirm-dialog-title"></h3>
      <p id="delDialogDesc" class="confirm-dialog-desc"></p>
      <div id="delDialogWarn" class="confirm-dialog-warn" hidden></div>
      <div id="delDialogVerify" class="confirm-dialog-verify" hidden>
        <label for="delConfirmInput">请输入完整节点名称 <code id="delExpectedName"></code> 以确认永久删除：</label>
        <input id="delConfirmInput" class="sub-input" type="text" placeholder="输入节点名称…" autocomplete="off">
      </div>
      <div class="confirm-dialog-actions">
        <button id="delDialogCancel" class="button ghost" type="button">取消</button>
        <button id="delDialogConfirm" class="button danger" type="submit">确认删除</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/nodes.js"></script>
</body>
</html>
