<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key 管理 · TQ Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="sub-page">
    <header class="sub-header">
      <div>
        <h1 class="sub-title">API Key 管理</h1>
        <p class="sub-desc">用于 <code>run-with-hub.sh</code> 直传 CSV 的鉴权凭证，密钥只在创建时显示一次。</p>
      </div>
      <a href="/" class="button ghost sub-back">← 返回首页</a>
    </header>

    <section class="sub-card">
      <h2 class="sub-card-title">生成新 Key</h2>
      <div class="keys-form">
        <input id="keyName" class="sub-input" type="text" placeholder="Key 名称（例如：服务器A）" maxlength="50" autocomplete="off">
        <button id="generateBtn" class="primary" type="button">生成</button>
      </div>
      <div id="secretDisplay" class="keys-secret" hidden>
        <div class="keys-secret-head">
          <span class="keys-secret-badge">✔ 已生成</span>
          <span class="keys-secret-tip">仅此一次显示，请立即复制保存</span>
        </div>
        <code class="keys-secret-value" id="secretValue"></code>
      </div>
    </section>

    <section class="sub-card">
      <h2 class="sub-card-title">已有密钥</h2>
      <div class="keys-table-wrap">
        <table class="keys-table">
          <thead>
            <tr>
              <th>名称</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>最后使用</th>
              <th class="keys-col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="keysList">
            <tr><td colspan="5" class="keys-empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/keys.js"></script>
</body>
</html>
