    const toast = document.getElementById("toast");
    const reportSections = [{"id":"ipv4","label":"IPv4回程","svgUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.svg?section=ipv4","pngUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=ipv4","pngDownloadUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=ipv4&format=png&rv=inter-noto-sc-fg-eee8d0-rsvg-2x-layout-v2"},{"id":"large4","label":"IPv4大包回程","svgUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.svg?section=large4","pngUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=large4","pngDownloadUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=large4&format=png&rv=inter-noto-sc-fg-eee8d0-rsvg-2x-layout-v2"},{"id":"cernet","label":"教育网回程","svgUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.svg?section=cernet","pngUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=cernet","pngDownloadUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=cernet&format=png&rv=inter-noto-sc-fg-eee8d0-rsvg-2x-layout-v2"},{"id":"intl","label":"国际互联","svgUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.svg?section=intl","pngUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=intl","pngDownloadUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=intl&format=png&rv=inter-noto-sc-fg-eee8d0-rsvg-2x-layout-v2"},{"id":"speedtest","label":"单线程测速","svgUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.svg?section=speedtest","pngUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=speedtest","pngDownloadUrl":"https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM.png?section=speedtest&format=png&rv=inter-noto-sc-fg-eee8d0-rsvg-2x-layout-v2"}];
    const reportId = "Bv0B-Hu6iM";
    const reportUrl = "https://tcpquality.ibsgss.uk/r/Bv0B-Hu6iM" || (window.location.origin + "/r/" + reportId);

    function activeSection() {
      const activeTab = document.querySelector(".tab.active");
      return reportSections.find((section) => section.id === activeTab?.dataset.target) || reportSections[0];
    }

    function armSaveImages() {
      if (!window.matchMedia("(hover: none), (max-width: 720px)").matches) return;
      document.querySelectorAll(".save-image[data-src]").forEach((img) => {
        if (!img.src) img.src = img.dataset.src;
      });
    }

    async function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    async function downloadActiveSvg() {
      for (const section of reportSections) {
        const response = await fetch(section.pngDownloadUrl, { cache: "no-store" });
        if (!response.ok) throw new Error("PNG download failed");
        const pngBlob = await response.blob();
        await downloadBlob(pngBlob, reportId + "-" + section.label + ".png");
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
    }

    function nodeSeekMarkdown() {
      const body = reportSections.map((section) => (
        "::: tab-item " + nodeSeekTabLabel(section) + "\n" +
        "![](" + section.pngUrl + ")\n" +
        ":::"
      )).join("\n\n");
      return ":::: tabs\n" + body + "\n::::\n\n报告链接：" + reportUrl;
    }

    function nodeSeekTabLabel(section) {
      if (section.id === "ipv4") return "IPv4回程";
      if (section.id === "large4") return "IPv4大包回程";
      if (section.id === "ipv6") return "IPv6回程";
      if (section.id === "cernet") return "教育网回程";
      if (section.id === "intl") return "国际互联";
      if (section.id === "speedtest") return "单线程测速";
      return section.label;
    }

    async function copyNodeSeekMarkdown() {
      const text = nodeSeekMarkdown();
      await copyText(text);
      showToast("复制成功");
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const input = document.createElement("textarea");
      input.value = text;
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.toggle("active", item === tab));
        panels.forEach((panel) => panel.classList.toggle("active", panel.id === tab.dataset.target));
      });
    });
    window.addEventListener("load", armSaveImages);
    window.addEventListener("resize", armSaveImages);
    document.getElementById("download-svg").addEventListener("click", async () => {
      try {
        await downloadActiveSvg();
      } catch (err) {
        console.error(err);
        alert("下载失败");
      }
    });
    document.getElementById("copy-nodeseek").addEventListener("click", async () => {
      try {
        await copyNodeSeekMarkdown();
      } catch (err) {
        console.error(err);
        alert("复制失败");
      }
    });
  </script>
</body>
